<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | SoloSmart</title>
  <meta name="description" content="Acesse sua conta SoloSmart.">
  <style>
    :root {
      --verde: #236b45;
      --verde-escuro: #174b31;
      --fundo: #f3f7f3;
      --texto: #203229;
      --cinza: #66756c;
      --borda: #dce6de;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, #edf5ee, #f8faf8);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 16px 45px rgba(28, 65, 43, .09);
    }
    .marca { text-align: center; margin-bottom: 28px; }
    .simbolo {
      width: 54px; height: 54px; margin: 0 auto 12px;
      display: grid; place-items: center; border-radius: 16px;
      background: var(--verde); color: white; font-size: 27px;
      font-weight: bold;
    }
    h1 { margin: 0; font-size: 27px; color: var(--verde-escuro); }
    .subtitulo { margin: 9px 0 0; color: var(--cinza); font-size: 14px; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%; padding: 13px 14px; border: 1px solid var(--borda);
      border-radius: 9px; font-size: 15px; outline: none;
    }
    input:focus { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(35,107,69,.10); }
    button {
      width: 100%; margin-top: 23px; padding: 14px;
      border: 0; border-radius: 9px; background: var(--verde);
      color: white; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: var(--verde-escuro); }
    button:disabled { opacity: .65; cursor: wait; }
    .mensagem {
      display: none; margin-top: 17px; padding: 12px;
      border-radius: 8px; font-size: 14px; line-height: 1.45;
    }
    .erro { display: block; color: #8a2525; background: #fff0f0; }
    .sucesso { display: block; color: #205d38; background: #edf8ef; }
    .rodape { margin-top: 22px; text-align: center; color: var(--cinza); font-size: 13px; }
    .rodape a { color: var(--verde); text-decoration: none; font-weight: 700; }
    .aviso { margin-top: 14px; color: var(--cinza); font-size: 12px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="container">
    <header class="marca">
      <div class="simbolo">S</div>
      <h1>SoloSmart</h1>
      <p class="subtitulo">Entre para acessar sua gestão rural</p>
    </header>

    <form id="formLogin">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required
             placeholder="seu@email.com">

      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password"
             required placeholder="Digite sua senha">

      <button id="botaoEntrar" type="submit">Entrar</button>
      <div id="mensagem" class="mensagem" role="status" aria-live="polite"></div>
    </form>

    <div class="rodape">
      Ainda não tem cadastro?
      <a href="cadastro.html">Solicitar acesso</a>
    </div>
    <p class="aviso">O acesso depende da aprovação da empresa e do usuário pela administração do SoloSmart.</p>
  </main>

  <iframe name="respostaSoloSmart" id="respostaSoloSmart"
          title="Resposta de autenticação" hidden></iframe>

  <form id="formValidacao" method="POST" target="respostaSoloSmart"
        action="https://script.google.com/macros/s/AKfycbx06T6GX4a8HuC3sn-iDe3QfJmv85NWRgHfnR-967KvM3h46GjYWToAMlobpEfacq6D/exec"
        hidden>
    <input name="action" value="validarAcesso">
    <input name="idToken" id="idToken">
  </form>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    // Configuração pública do aplicativo Firebase SoloSmart.
    const firebaseConfig = {
      apiKey: "AIzaSyBzt9NrZaX24HP9husP9iwTjUHsUEtBrWc",
      authDomain: "solosmart.firebaseapp.com",
      projectId: "solosmart",
      storageBucket: "solosmart.firebasestorage.app",
      messagingSenderId: "684064638812",
      appId: "1:684064638812:web:e3e038664a47a5701b2399",
      measurementId: "G-9G79YVZ2XM"
    };

    const API_ORIGEM = "solosmart-api";
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const formLogin = document.getElementById("formLogin");
    const botao = document.getElementById("botaoEntrar");
    const mensagem = document.getElementById("mensagem");
    const iframe = document.getElementById("respostaSoloSmart");
    let aguardandoValidacao = false;

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = "mensagem " + tipo;
    }

    function bloquearFormulario(bloquear) {
      botao.disabled = bloquear;
      botao.textContent = bloquear ? "Verificando..." : "Entrar";
    }

    formLogin.addEventListener("submit", async function(evento) {
      evento.preventDefault();
      mensagem.className = "mensagem";
      bloquearFormulario(true);

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      try {
        const credencial = await auth.signInWithEmailAndPassword(email, senha);
        const idToken = await credencial.user.getIdToken(true);

        aguardandoValidacao = true;
        document.getElementById("idToken").value = idToken;
        document.getElementById("formValidacao").submit();

        mostrarMensagem("Credenciais confirmadas. Verificando sua autorização...", "sucesso");
      } catch (erro) {
        bloquearFormulario(false);
        const mensagens = {
          "auth/invalid-email": "O formato do e-mail é inválido.",
          "auth/user-disabled": "Esta conta está desativada.",
          "auth/user-not-found": "Não existe uma conta com esse e-mail.",
          "auth/wrong-password": "E-mail ou senha incorretos.",
          "auth/invalid-credential": "E-mail ou senha incorretos.",
          "auth/too-many-requests": "Muitas tentativas. Aguarde e tente novamente."
        };
        mostrarMensagem(mensagens[erro.code] || "Não foi possível entrar. Verifique seus dados e tente novamente.", "erro");
      }
    });

    window.addEventListener("message", function(evento) {
      if (evento.source !== iframe.contentWindow) return;
      const resposta = evento.data;

      if (!resposta || resposta.origem !== API_ORIGEM || !resposta.dados) return;
      if (!aguardandoValidacao) return;

      aguardandoValidacao = false;
      bloquearFormulario(false);

      if (!resposta.dados.sucesso) {
        mostrarMensagem(resposta.dados.mensagem || "Acesso não autorizado.", "erro");
        return;
      }

      const usuario = resposta.dados.usuario;
      sessionStorage.setItem("solosmart_usuario", JSON.stringify(usuario));
      mostrarMensagem("Acesso autorizado. Sua conta está pronta para entrar no painel.", "sucesso");

      // Após criar a página do painel, substitua o comentário abaixo por:
      // window.location.href = "painel.html";
    });

    iframe.addEventListener("load", function() {
      // A primeira carga do iframe é vazia. A resposta real chega por postMessage.
    });
  </script>
</body>
</html>
