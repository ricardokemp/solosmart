
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f3f6f4;
      color: #26352d;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      color: #176b45;
      margin-bottom: 6px;
    }

    .subtitulo {
      color: #65736a;
    }

    .painel {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 3px 15px #0000000d;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 12px 0;
      border: 1px solid #ccd6cf;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin: 4px;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .principal, .aprovar {
      background: #176b45;
      color: white;
    }

    .rejeitar {
      background: #a93232;
      color: white;
    }

    .secundario {
      background: #e8eee9;
      color: #26352d;
    }

    .empresa {
      border: 1px solid #e0e7e2;
      border-radius: 9px;
      padding: 18px;
      margin-top: 14px;
    }

    .empresa h3 {
      margin: 0 0 12px;
      color: #176b45;
    }

    .empresa p {
      margin: 7px 0;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #edf1ee;
      font-size: 12px;
      font-weight: bold;
    }

    .mensagem {
      margin-top: 14px;
      color: #176b45;
      overflow-wrap: anywhere;
    }

    .erro {
      color: #a93232;
    }

    .oculto {
      display: none !important;
    }

    .topo-lista {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .acoes {
      margin-top: 15px;
    }

    .resumo {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .indicador {
      flex: 1;
      min-width: 130px;
      padding: 15px;
      background: #f3f6f4;
      border-radius: 8px;
    }

    .indicador strong {
      display: block;
      font-size: 24px;
      color: #176b45;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>SoloSmart</h1>
      <div class="subtitulo">Painel de administração</div>
    </header>

    <section id="login" class="painel">
      <h2>Acesso administrativo</h2>

      <form id="formLogin">
        <label for="senha">Senha administrativa</label>

        <input
          id="senha"
          type="password"
          autocomplete="current-password"
          required
          maxlength="256"
          placeholder="Digite sua senha"
        >

        <button class="principal" id="botaoLogin" type="submit">
          Entrar
        </button>
      </form>

      <div id="mensagemLogin" class="mensagem"></div>
    </section>

    <section id="areaAdmin" class="oculto">

      <div class="painel">
        <div class="topo-lista">
          <div>
            <h2>Empresas cadastradas</h2>
            <div class="subtitulo">
              Consulte e gerencie as solicitações.
            </div>
          </div>

          <div>
            <button class="secundario" id="botaoAtualizar"
              onclick="carregarEmpresas()">
              Atualizar
            </button>

            <button class="secundario" onclick="sair()">
              Sair
            </button>
          </div>
        </div>

        <div class="resumo">
          <div class="indicador">
            Pendentes
            <strong id="totalPendentes">0</strong>
          </div>

          <div class="indicador">
            Aprovadas
            <strong id="totalAprovadas">0</strong>
          </div>

          <div class="indicador">
            Rejeitadas
            <strong id="totalRejeitadas">0</strong>
          </div>
        </div>

        <div id="mensagemLista" class="mensagem"></div>
        <div id="listaEmpresas"></div>
      </div>

    </section>
  </div>

  <script>
    let tokenAdmin = null;
    let empresasCarregadas = [];

    const formLogin = document.getElementById("formLogin");
    const campoSenha = document.getElementById("senha");

    formLogin.addEventListener("submit", function(event) {
      event.preventDefault();

      const senha = campoSenha.value;
      const botao = document.getElementById("botaoLogin");
      const mensagem = document.getElementById("mensagemLogin");

      botao.disabled = true;
      mensagem.textContent = "Validando acesso...";
      mensagem.className = "mensagem";

      google.script.run
        .withSuccessHandler(function(resultado) {
          botao.disabled = false;
          campoSenha.value = "";

          tokenAdmin = resultado.token;

          document.getElementById("login").classList.add("oculto");
          document.getElementById("areaAdmin").classList.remove("oculto");

          carregarEmpresas();
        })
        .withFailureHandler(function(erro) {
          botao.disabled = false;
          mensagem.textContent =
            erro.message || "Não foi possível entrar.";

          mensagem.className = "mensagem erro";
        })
        .adminLogin(senha);
    });


    // ======================================
    // CARREGAR EMPRESAS
    // ======================================

    function carregarEmpresas() {
      if (!tokenAdmin) return;

      const lista = document.getElementById("listaEmpresas");
      const mensagem = document.getElementById("mensagemLista");
      const botao = document.getElementById("botaoAtualizar");

      botao.disabled = true;
      mensagem.textContent = "Carregando empresas...";
      mensagem.className = "mensagem";

      google.script.run
        .withSuccessHandler(function(empresas) {
          botao.disabled = false;

          empresasCarregadas = empresas || [];

          atualizarResumo();
          renderizarEmpresas();

          mensagem.textContent =
            empresasCarregadas.length + " empresa(s) encontrada(s).";
        })
        .withFailureHandler(function(erro) {
          botao.disabled = false;

          mensagem.textContent =
            erro.message || "Erro ao carregar empresas.";

          mensagem.className = "mensagem erro";

          if (
            mensagem.textContent.toLowerCase().includes("sessão")
          ) {
            encerrarLocalmente();
          }
        })
        .listarEmpresasAdmin(tokenAdmin);
    }


    // ======================================
    // ATUALIZAR INDICADORES
    // ======================================

    function atualizarResumo() {
      const pendentes = empresasCarregadas.filter(
        empresa => empresa.status === "pendente"
      ).length;

      const aprovadas = empresasCarregadas.filter(
        empresa => empresa.status === "aprovada"
      ).length;

      const rejeitadas = empresasCarregadas.filter(
        empresa => empresa.status === "rejeitada"
      ).length;

      document.getElementById("totalPendentes").textContent = pendentes;
      document.getElementById("totalAprovadas").textContent = aprovadas;
      document.getElementById("totalRejeitadas").textContent = rejeitadas;
    }


    // ======================================
    // MOSTRAR EMPRESAS
    // ======================================

    function renderizarEmpresas() {
      const lista = document.getElementById("listaEmpresas");
      lista.innerHTML = "";

      if (empresasCarregadas.length === 0) {
        lista.textContent = "Nenhuma empresa cadastrada.";
        return;
      }

      empresasCarregadas.forEach(function(empresa) {
        const card = document.createElement("div");
        card.className = "empresa";

        const titulo = document.createElement("h3");
        titulo.textContent = empresa.nome || "Empresa sem nome";
        card.appendChild(titulo);

        adicionarTexto(card, "E-mail: ", empresa.email);
        adicionarTexto(card, "CNPJ: ", empresa.cnpj || "Não informado");
        adicionarTexto(card, "Telefone: ", empresa.telefone);
        adicionarTexto(
          card,
          "Localização: ",
          [empresa.cidade, empresa.estado].filter(Boolean).join(" / ")
        );
        adicionarTexto(card, "Cadastro: ", empresa.data_cadastro);

        const status = document.createElement("span");
        status.className = "status";
        status.textContent = "Status: " + empresa.status;
        card.appendChild(status);

        if (empresa.status === "pendente") {
          const acoes = document.createElement("div");
          acoes.className = "acoes";

          const aprovar = document.createElement("button");
          aprovar.className = "aprovar";
          aprovar.textContent = "Aprovar";
          aprovar.addEventListener("click", function() {
            alterarStatus(empresa.empresa_id, "aprovada");
          });

          const rejeitar = document.createElement("button");
          rejeitar.className = "rejeitar";
          rejeitar.textContent = "Rejeitar";
          rejeitar.addEventListener("click", function() {
            alterarStatus(empresa.empresa_id, "rejeitada");
          });

          acoes.appendChild(aprovar);
          acoes.appendChild(rejeitar);
          card.appendChild(acoes);
        }

        lista.appendChild(card);
      });
    }


    // ======================================
    // ADICIONAR TEXTO COM SEGURANÇA
    // ======================================

    function adicionarTexto(card, rotulo, valor) {
      const paragrafo = document.createElement("p");
      const forte = document.createElement("strong");

      forte.textContent = rotulo;
      paragrafo.appendChild(forte);
      paragrafo.appendChild(
        document.createTextNode(String(valor || "Não informado"))
      );

      card.appendChild(paragrafo);
    }


    // ======================================
    // ALTERAR STATUS
    // ======================================

    function alterarStatus(empresaId, novoStatus) {
      const acao = novoStatus === "aprovada"
        ? "aprovar"
        : "rejeitar";

      if (!confirm("Deseja realmente " + acao + " esta empresa?")) {
        return;
      }

      const mensagem = document.getElementById("mensagemLista");
      mensagem.textContent = "Atualizando cadastro...";
      mensagem.className = "mensagem";

      google.script.run
        .withSuccessHandler(function(resultado) {
          mensagem.textContent = resultado.mensagem;
          mensagem.className = "mensagem";

          carregarEmpresas();
        })
        .withFailureHandler(function(erro) {
          mensagem.textContent =
            erro.message || "Não foi possível atualizar o cadastro.";

          mensagem.className = "mensagem erro";

          if (
            mensagem.textContent.toLowerCase().includes("sessão")
          ) {
            encerrarLocalmente();
          }
        })
        .atualizarStatusEmpresaAdmin(
          tokenAdmin,
          empresaId,
          novoStatus
        );
    }


    // ======================================
    // SAIR
    // ======================================

    function sair() {
      if (tokenAdmin) {
        google.script.run
          .withSuccessHandler(encerrarLocalmente)
          .withFailureHandler(encerrarLocalmente)
          .adminLogout(tokenAdmin);
      } else {
        encerrarLocalmente();
      }
    }

    function encerrarLocalmente() {
      tokenAdmin = null;
      empresasCarregadas = [];

      document.getElementById("areaAdmin").classList.add("oculto");
      document.getElementById("login").classList.remove("oculto");

      document.getElementById("listaEmpresas").innerHTML = "";
      document.getElementById("mensagemLogin").textContent = "";
      document.getElementById("senha").value = "";
    }
  </script>
</body>
</html>
